# NAV domain configuration (ARCH-COMP 2025 AINNCS, Section 3.11).
#
# The plant is continuous, so the monolithic table approach requires a lattice.
# Every real value below is stored as round(value * scale) in the .tree model.
#
# Resolution is not free to choose: one control period changes speed and angle
# by at most |u| * dt = 0.2, so a lattice coarser than 0.2 freezes the robot
# (verified: at scale 2 the trajectory never leaves the initial cell).
# scale = 5 is therefore the coarsest lattice on which the closed loop still
# reaches the goal.

lattice:
  scale: 5            # integer units per unit of state; resolution = 1/scale
  dt_num: 1           # control period 0.2 s = dt_num / dt_den
  dt_den: 5

# Bounds of the modelled box, in real units.
#
# Sized from the envelope of the lattice closed loop over the initial set, plus
# one cell of margin. The box is an ASSUMPTION: environment_update clamps at its
# edge, and clamping would silently keep an escaping robot inside. The generated
# model therefore carries a strict-interior INVARSPEC, so the assumption is
# discharged rather than hidden -- if the state ever reaches the boundary that
# specification fails and the box, not the controller, is wrong.
#
# These bounds give 198,375 table entries, the figure reported in
# reports/NAV/2026_09_03_monolithic_first_run.md section 6.
bounds:
  x1: [-1.0, 3.4]     # position, horizontal
  x2: [-1.0, 3.4]     # position, vertical
  x3: [-2.4, 0.4]     # speed
  x4: [-1.2, 3.6]     # heading angle (radians)

initial_state:        # ARCH-COMP: x1,x2 in [2.9,3.1]; we take the midpoint
  x1: 3.0
  x2: 3.0
  x3: 0.0
  x4: 0.0

obstacle:             # must never be entered
  x1: [1.0, 2.0]
  x2: [1.0, 2.0]

goal:                 # must be reached
  x1: [-0.5, 0.5]
  x2: [-0.5, 0.5]

horizon_steps: 30     # 6 s at 0.2 s per control period

trig_scale: 1000      # cos/sin lookup tables stored as round(value * trig_scale)

networks:
  point: ../networks/nn-nav-point-lattice-s5.onnx
  set:   ../networks/nn-nav-set-lattice-s5.onnx
