# NAV domain configuration (ARCH-COMP 2025 AINNCS, Section 3.11).
#
# The plant is continuous, so the monolithic table approach requires a lattice.
# Every real value below is stored as round(value * scale) in the .tree model.
#
# Resolution is not free to choose: one control period changes speed and angle
# by at most |u| * dt = 0.2, so a lattice coarser than 0.2 freezes the robot
# (verified: at scale 2 the trajectory never leaves the initial cell).
# scale = 5 is therefore the coarsest lattice on which the closed loop still
# reaches the goal.

# Three independent lattices. Sharing one scale conflated two separate
# decisions -- "can the robot take a step" (position) and "how many control
# levels does the plant see" (speed and heading) -- because the control delta
# is round(u * scale * dt), so scale and control resolution moved together.
#
#   position_scale  cell size for x1, x2; too coarse and the robot cannot move
#   speed_scale     control levels for u1 are +/- round(speed_scale * dt)
#   heading_scale   control levels for u2 are +/- round(heading_scale * dt)
#                   and it also indexes the cos/sin tables
#
# At speed_scale = 5 and dt = 0.2 the product is 1, i.e. a THREE-level
# controller. Raising it is what makes the plant see the tanh network rather
# than a bang-bang approximation of it.
lattice:
  position_scale: 5
  speed_scale: 5
  heading_scale: 5
  dt_num: 1           # control period 0.2 s = dt_num / dt_den
  dt_den: 5

# Bounds of the modelled box, in real units.
#
# Sized from the envelope of the lattice closed loop over the initial set, plus
# one cell of margin. The box is an ASSUMPTION: environment_update clamps at its
# edge, and clamping would silently keep an escaping robot inside. The generated
# model therefore carries a strict-interior INVARSPEC, so the assumption is
# discharged rather than hidden -- if the state ever reaches the boundary that
# specification fails and the box, not the controller, is wrong.
#
# These bounds give 198,375 table entries, the figure reported in
# reports/NAV/2026_09_03_monolithic_first_run.md section 6.
bounds:
  x1: [-1.0, 3.4]     # position, horizontal
  x2: [-1.0, 3.4]     # position, vertical
  x3: [-2.4, 0.4]     # speed
  x4: [-1.2, 3.6]     # heading angle (radians)

initial_state:        # ARCH-COMP: x1,x2 in [2.9,3.1]; we take the midpoint
  x1: 3.0
  x2: 3.0
  x3: 0.0
  x4: 0.0

obstacle:             # must never be entered
  x1: [1.0, 2.0]
  x2: [1.0, 2.0]

goal:                 # must be reached
  x1: [-0.5, 0.5]
  x2: [-0.5, 0.5]

horizon_steps: 30     # 6 s at 0.2 s per control period

trig_scale: 1000      # cos/sin lookup tables stored as round(value * trig_scale)

# Which controllers exist. Wrapper filenames are derived from the scales above
# by core.nav_wrapper_builder, so these are just the names.
networks:
  point: point
  set:   set

# Position successor relation.
#
#   deterministic  round the Euler increment to one lattice point. Fast, but
#                  the model is neither an over- nor an under-approximation of
#                  the plant, so a TRUE verdict licenses almost nothing.
#   interval       assign nondeterministically over {floor, ceil} of the exact
#                  increment, so the successor covers every rounding. TRUE then
#                  means the property holds for all of them -- an actual
#                  over-approximation claim, though only of Euler-from-centre
#                  rounding, not of the cell around the centre.
successor: deterministic
