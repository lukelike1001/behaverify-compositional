# acas_verifier_params.yaml
# Configuration for A/G contract verification of the ACAS Xu closed-loop NSBT.
# See core/safety/acas_safety_contract_verifier.py for schema and class indices.
#
# Contracts are produced by AcasSafetyContractGenerator (range bounds in JSON).
# AcasSafetyContractVerifier loads them and calls CROWN.
# smv_variables is consumed by AcasSmvContractPatcher.

# Pre-computed contract specs (output of acas_safety_contract_generator.py).
contracts_path: "contracts/discrete/safety/safety_full_contracts.json"

# Which NN to verify.  network_idx corresponds to the a_prev selector in the tree:
#   1 = a_prev=clear        (aprev_clear.onnx)
#   2 = a_prev=weak_right   (aprev_weak_right.onnx)
#   3 = a_prev=weak_left    (aprev_weak_left.onnx)
#   4 = a_prev=strong_right (aprev_strong_right.onnx)
#   5 = a_prev=strong_left  (aprev_strong_left.onnx)
network_idx: 1

# Number of NN output classes.
# clear=0, weak_left=1, weak_right=2, strong_left=3, strong_right=4
num_classes: 5

# Verification parameters
verification:
  # BaB timeout in seconds per contract (continuous mode).
  # ACAS Xu input regions are much smaller than grid-world contracts, so
  # 30 s is a reasonable starting point (vs 60 s for grid world).
  timeout_sec: 30

  # Discrete mode: epsilon applied symmetrically around each exact (x_mag, y_mag)
  # state when constructing CROWN input bounds (lower = exact - eps, upper = exact + eps).
  # 0.0 means each CROWN call checks the exact integer state point, matching the
  # 2025_NEUS table approach.  Raise to a small value (e.g. 1e-5) if alpha-beta-CROWN
  # crashes with inf/NaN due to zero-width bounds in cut_ops.py.
  discrete_state_eps: 0.0

  # Default per-state BaB timeout for discrete mode (seconds).
  # Each dangerous (x_mag, y_mag) state gets this budget independently.
  # Overridden at runtime by --discrete-timeout.
  discrete_timeout_sec: 5.0

# Output path for verification report (relative to example root).
# Override with --output for discrete mode or non-NN_1 runs.
output_path: "contracts/continuous/enabled_pgd/aprev_clear_crown_results.json"

# SMV variable names from acas_closed_loop.smv (dsl_to_nuxmv from the tree).
# Used by AcasSmvContractPatcher for INVAR constraint injection.
# These names are stage-suffixed BehaVerify variable names — inspect the SMV
# to confirm they match after any tree regeneration.
smv_variables:
  command_prev:  "command_stage_0"    # a_prev (which NN was last chosen)
  command_final: "command_stage_5"    # final NN output after tree execution
  x_mag:         "x_mag_stage_0"
  y_mag:         "y_mag_stage_0"
  x_sign:        "x_sign_stage_0"    # x sign (+1 or -1)
  y_sign:        "y_sign_stage_0"    # y sign (+1 or -1)
  heading:       "heading_own_var_stage_0"
